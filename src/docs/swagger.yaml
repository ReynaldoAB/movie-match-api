openapi: 3.0.0
info:
  title: Movie Match API
  version: 1.0.0
  description: API para gestionar películas y obtener recomendaciones con IA

servers:
  - url: http://localhost:3000
    description: Servidor local

paths:
  /movies:
    get:
      summary: Obtener todas las películas
      tags:
        - Movies
      responses:
        '200':
          description: Lista de películas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Movie'
                  count:
                    type: integer
    
    post:
      summary: Crear una nueva película
      tags:
        - Movies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - year
                - rating
              properties:
                title:
                  type: string
                  example: "Inception"
                year:
                  type: integer
                  example: 2010
                rating:
                  type: number
                  format: float
                  example: 8.8
                poster:
                  type: string
                  example: "https://example.com/inception.jpg"
      responses:
        '201':
          description: Película creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Movie'
        '400':
          description: Error en los datos enviados

  /movies/filter:
    get:
      summary: Filtrar películas por rating mínimo
      tags:
        - Movies
      parameters:
        - in: query
          name: minRating
          required: true
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 10
          description: Rating mínimo (0-10)
      responses:
        '200':
          description: Películas filtradas por rating
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Movie'
                  count:
                    type: integer

  /movies/discover:
    get:
      summary: Descubrir películas aleatorias con análisis de IA
      tags:
        - Movies
      parameters:
        - in: query
          name: count
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
          description: Cantidad de películas a obtener
      responses:
        '200':
          description: Películas con análisis de IA
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Movie'
                  count:
                    type: integer
                  requested:
                    type: integer

  /movies/search:
    get:
      summary: Búsqueda avanzada de películas
      tags:
        - Movies
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Texto a buscar en el título
        - in: query
          name: genre
          schema:
            type: string
            enum: [ACTION, COMEDY, DRAMA, HORROR, SCIFI, THRILLER]
          description: Filtrar por género
        - in: query
          name: yearMin
          schema:
            type: integer
          description: Año mínimo
        - in: query
          name: yearMax
          schema:
            type: integer
          description: Año máximo
        - in: query
          name: ratingMin
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 10
          description: Rating mínimo (0-10)
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Página actual
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 10
          description: Tamaño de página
      responses:
        '200':
          description: Resultados de búsqueda paginados
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Movie'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer

  /stats:
    get:
      summary: Obtener estadísticas del dashboard
      tags:
        - Stats
      responses:
        '200':
          description: Estadísticas generales de películas y reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      totalMovies:
                        type: integer
                      totalReviews:
                        type: integer
                      avgRating:
                        type: number
                        format: float
                      moviesByGenre:
                        type: array
                        items:
                          type: object
                          properties:
                            genre:
                              type: string
                            count:
                              type: integer
                            avgRating:
                              type: number
                              format: float
                      topRated:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            title:
                              type: string
                            rating:
                              type: number
                              format: float
                            genre:
                              type: string
                      mostReviewed:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            title:
                              type: string
                            reviewCount:
                              type: integer
                      recentReviews:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            author:
                              type: string
                            rating:
                              type: number
                              format: float
                            comment:
                              type: string
                            movieTitle:
                              type: string
                            createdAt:
                              type: string
                              format: date-time

  /movies/{id}:
    get:
      summary: Obtener película por ID
      tags:
        - Movies
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID de la película
      responses:
        '200':
          description: Película encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Movie'
        '404':
          description: Película no encontrada

components:
  schemas:
    Movie:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "The Shawshank Redemption"
        year:
          type: integer
          example: 1994
        rating:
          type: number
          format: float
          example: 9.3
        poster:
          type: string
          example: "https://example.com/poster.jpg"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time